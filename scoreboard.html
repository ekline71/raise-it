<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Out-of-Town Scoreboard</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b3d2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; min-height:100%;
    background:#000;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:#fff;
  }
  a{ color:inherit; }
  .top{
    display:flex; align-items:center; gap:10px;
    padding:14px 16px;
    background:#000;
    border-bottom:1px solid #1a1a1a;
  }
  .top img{ width:34px; height:34px; border-radius:8px; }
  .top-titles{ display:flex; flex-direction:column; }
  .top-titles h1{
    margin:0; font-size:15px; letter-spacing:0.04em;
    color:#FFC72C; text-transform:uppercase;
  }
  .top-titles .sub{ font-size:11px; color:#666; }
  .back-link{
    margin-left:auto;
    font-size:12px;
    color:#8a6a1c;
    text-decoration:none;
    border:1px solid #2e2e2e;
    padding:6px 10px;
    border-radius:6px;
    white-space:nowrap;
  }
  .board-outer{
    max-width:760px;
    margin:18px auto 40px;
    padding:0 12px;
  }
  .board{
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 1px, transparent 1px, transparent 3px),
      linear-gradient(180deg, #1f7a5c, #145c44);
    border:6px solid #0b3d2e;
    border-radius:6px;
    padding:14px;
  }
  .league-bar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    background:#175a43;
    border:2px solid #0b3d2e;
    border-radius:4px;
    padding:8px 10px;
    margin:16px 0 10px;
  }
  .league-bar:first-of-type{ margin-top:4px; }
  .league-num{
    width:34px; height:34px; flex-shrink:0;
    border-radius:50%;
    background:#FFC72C;
    border:3px solid #8a6a1c;
    color:#0b3d2e;
    font-weight:800;
    font-size:14px;
    display:flex; align-items:center; justify-content:center;
  }
  .league-title{
    font-size:clamp(16px,3.6vw,26px);
    font-weight:800;
    letter-spacing:0.08em;
    color:#fff;
    text-transform:uppercase;
    text-align:center;
    text-shadow:1px 1px 0 rgba(0,0,0,0.3);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:2px;
    background:#0b3d2e;
    border:2px solid #0b3d2e;
  }
  .cell{
    background:#175a43;
    padding:10px 10px;
    display:flex;
    align-items:center;
    gap:8px;
    min-height:108px;
    min-width:0;
  }
  .diamond-wrap{
    position:relative;
    width:86px; height:86px;
    flex-shrink:0;
    display:flex; flex-direction:column; align-items:center;
  }
  .diamond-wrap svg{ width:86px; height:86px; }
  .teams{
    flex-shrink:0;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .team-abbr{
    height:34px;
    display:flex;
    align-items:center;
    font-family:'Archivo Black', 'Arial Black', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size:23px;
    font-weight:400;
    letter-spacing:0.02em;
    color:#fff;
    text-transform:uppercase;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    line-height:1;
  }
  .readout{
    flex-shrink:0;
    margin-left:auto;
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:5px;
  }
  .readout-flag-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
  }
  .readout-dot{
    width:7px; height:7px;
    border-radius:50%;
    background:#123d24;
  }
  .readout-dot.lit{
    background:#2ecc71;
    box-shadow:0 0 4px rgba(46,204,113,0.8);
  }
  .readout-flag{
    background:#0a1f14;
    border:1px solid #05170d;
    border-radius:2px;
    padding:3px 8px;
    font-family:'Courier New', ui-monospace, monospace;
    font-weight:700;
    font-size:15px;
    color:#FFB000;
    text-shadow:0 0 5px rgba(255,176,0,0.5);
    text-align:center;
    line-height:1.15;
    min-width:20px;
  }
  .readout-scores{
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .score-digit{
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0a1f14;
    border:1px solid #05170d;
    border-radius:2px;
    padding:0 7px;
    font-family:'Courier New', ui-monospace, monospace;
    font-weight:700;
    font-size:22px;
    line-height:1;
    color:#FFB000;
    text-shadow:0 0 6px rgba(255,176,0,0.55);
    min-width:1ch;
    text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .score-digit.dim{ color:#3a2c14; text-shadow:none; }
  .footer-bar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-top:16px;
    flex-wrap:wrap;
  }
  .updated{
    font-size:10px;
    letter-spacing:0.1em;
    color:#8a6a1c;
    text-transform:uppercase;
  }
  .refresh-btn{
    font-size:11px;
    color:#FFC72C;
    background:#111;
    border:1px solid #2e2e2e;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .empty-msg{
    text-align:center;
    padding:30px 10px;
    color:#9fd4bd;
    font-size:13px;
  }
  @media (max-width:600px){
    .league-num{ display:none; }
    .board-outer{ padding:0 5px; }
    .board{ padding:6px; }
    .league-bar{ padding:5px 4px; gap:6px; }
    .league-title{ font-size:13px; }
    .cell{ padding:6px; gap:4px; min-height:auto; }
    .diamond-wrap{ width:68px; height:68px; }
    .diamond-wrap svg{ width:68px; height:68px; }
    .teams{ gap:2px; }
    .team-abbr{ height:24px; font-size:16px; }
    .readout{ min-width:20px; gap:3px; }
    .readout-dot{ width:6px; height:6px; }
    .readout-flag{ font-size:11px; max-width:38px; padding:2px 5px; min-width:16px; }
    .readout-scores{ gap:2px; }
    .score-digit{ height:24px; font-size:14px; padding:0 5px; }
  }
</style>
</head>
<body>
<div class="top">
  <img src="apple-touch-icon.png" alt="">
  <div class="top-titles">
    <h1>Out-of-Town Scoreboard</h1>
    <div class="sub">All MLB scores, right field wall style</div>
  </div>
  <a class="back-link" href="index.html">Hoist-O-Meter &rarr;</a>
</div>

<div class="board-outer">
  <div class="board" id="board">
    <div class="empty-msg" id="emptyMsg">Loading today&rsquo;s games&hellip;</div>
  </div>
  <div class="footer-bar">
    <div class="updated" id="updated">LOADING&hellip;</div>
    <button class="refresh-btn" id="refreshBtn">Refresh</button>
  </div>
</div>

<script>
const teamAbbrMap = {
  134:"PIT",113:"CIN",112:"CHC",158:"MIL",138:"STL",
  137:"SF", 119:"LAD",121:"NYM",143:"PHI",144:"ATL",
  146:"MIA",120:"WSH",109:"ARI",115:"COL",135:"SD",
  108:"LAA",117:"HOU",133:"OAK",136:"SEA",140:"TEX",
  116:"DET",118:"KC", 142:"MIN",145:"CWS",114:"CLE",
  110:"BAL",111:"BOS",147:"NYY",139:"TB", 141:"TOR",
};
const NL_TEAM_IDS = new Set([134,113,112,158,138,137,119,121,143,144,146,120,109,115,135]);
const AL_TEAM_IDS = new Set([108,117,133,136,140,116,118,142,145,114,110,111,147,139,141]);

function getAbbr(teamData){
  return teamData.team?.abbreviation
    || teamAbbrMap[teamData.team?.id]
    || (teamData.team?.name ?? "???").substring(0,3).toUpperCase();
}

function diamondSvg(onFirst, onSecond, onThird, outs){
  const base = (cx, cy, on) => `<circle cx="${cx}" cy="${cy}" r="7" fill="${on ? '#e0342a' : '#0a2647'}" stroke="#eef3f8" stroke-width="2"/>`;
  const outLight = (cx, lit) => `<circle cx="${cx}" cy="72" r="6" fill="${lit ? '#e0342a' : '#5a1712'}" stroke="#000000" stroke-width="1.5"/>`;
  return `
  <svg viewBox="0 0 100 100">
    <polygon points="50,6 94,50 50,94 6,50" fill="none" stroke="#FFC72C" stroke-width="5"/>
    ${base(50, 26, onSecond)}
    ${base(75, 50, onFirst)}
    ${base(25, 50, onThird)}
    <text x="50" y="60" text-anchor="middle" font-size="13" font-weight="800" fill="#FFC72C" font-family="Arial, sans-serif" letter-spacing="0.5">OUT</text>
    ${outLight(43, outs >= 1)}
    ${outLight(57, outs >= 2)}
  </svg>`;
}

function etDate(){
  return new Date().toLocaleDateString("en-CA", { timeZone:"America/New_York" });
}

async function fetchGames(){
  const url = `https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${etDate()}&hydrate=linescore,team`;
  try{
    const res = await fetch(url);
    const data = await res.json();
    return data.dates?.[0]?.games ?? [];
  }catch(err){
    console.error("Failed to fetch schedule", err);
    return null;
  }
}

function formatStartTimeShort(iso){
  const full = new Date(iso).toLocaleTimeString("en-US", {
    hour:"numeric", minute:"2-digit", hour12:true, timeZone:"America/New_York",
  });
  return full.replace(" AM", "a").replace(" PM", "p");
}

function renderCell(game){
  const away = game.teams.away;
  const home = game.teams.home;
  const awayAbbr = getAbbr(away);
  const homeAbbr = getAbbr(home);
  const state = game.status.abstractGameState;
  const detail = game.status.detailedState;
  const ls = game.linescore || {};
  const isLive = state === "Live";
  const isFinal = state === "Final";
  const isPreview = state === "Preview";

  const hasScore = !isPreview;
  const awayScore = hasScore ? String(away.score ?? 0) : "–";
  const homeScore = hasScore ? String(home.score ?? 0) : "–";

  const irregular = /postponed|suspended|delayed|cancelled/i.test(detail || "");

  let flag = "", topLit = false, bottomLit = false;
  if(irregular){
    flag = (detail || "").toUpperCase().slice(0,9);
  }else if(isFinal){
    flag = (ls.currentInning && ls.currentInning !== 9) ? `F/${ls.currentInning}` : "F";
  }else if(isLive){
    const isBottom = ls.inningState === "Bottom" || ls.inningHalf === "Bottom";
    flag = String(ls.currentInning ?? "");
    topLit = !isBottom;
    bottomLit = isBottom;
  }else if(isPreview){
    flag = formatStartTimeShort(game.gameDate);
  }

  const outs = ls.outs ?? 0;
  const offense = ls.offense || {};
  const showRunners = isLive;

  return `
  <div class="cell">
    <div class="diamond-wrap">
      ${diamondSvg(showRunners && !!offense.first, showRunners && !!offense.second, showRunners && !!offense.third, showRunners ? outs : 0)}
    </div>
    <div class="teams">
      <span class="team-abbr">${awayAbbr}</span>
      <span class="team-abbr">${homeAbbr}</span>
    </div>
    <div class="readout">
      <div class="readout-flag-col">
        <div class="readout-dot ${topLit ? 'lit' : ''}"></div>
        <div class="readout-flag">${flag}</div>
        <div class="readout-dot ${bottomLit ? 'lit' : ''}"></div>
      </div>
      <div class="readout-scores">
        <span class="score-digit ${hasScore ? '' : 'dim'}">${awayScore}</span>
        <span class="score-digit ${hasScore ? '' : 'dim'}">${homeScore}</span>
      </div>
    </div>
  </div>`;
}

function leagueOf(game){
  const homeId = game.teams.home.team?.id;
  return NL_TEAM_IDS.has(homeId) ? "NL" : "AL";
}

function renderBoard(games){
  const board = document.getElementById("board");
  if(!games || games.length === 0){
    board.innerHTML = `<div class="empty-msg">No games scheduled today.</div>`;
    return;
  }

  const groups = { NL: [], AL: [] };
  for(const g of games) groups[leagueOf(g)].push(g);

  const sections = [];
  if(groups.NL.length){
    sections.push(`
      <div class="league-bar">
        <div class="league-num">21</div>
        <div class="league-title">National League</div>
        <div class="league-num">21</div>
      </div>
      <div class="grid">${groups.NL.map(renderCell).join("")}</div>`);
  }
  if(groups.AL.length){
    sections.push(`
      <div class="league-bar">
        <div class="league-num">21</div>
        <div class="league-title">American League</div>
        <div class="league-num">21</div>
      </div>
      <div class="grid">${groups.AL.map(renderCell).join("")}</div>`);
  }

  board.innerHTML = sections.join("");
}

async function refresh(){
  const games = await fetchGames();
  if(games !== null) renderBoard(games);
  const updatedEl = document.getElementById("updated");
  const now = new Date();
  updatedEl.textContent = games === null
    ? "UPDATE FAILED · RETRYING"
    : `UPDATED ${now.toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit", second:"2-digit" })}`;
}

document.getElementById("refreshBtn").addEventListener("click", refresh);
refresh();
setInterval(refresh, 20000);
</script>
</body>
</html>
