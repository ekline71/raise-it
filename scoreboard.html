<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Out-of-Town Scoreboard</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0b3d2e">
<style>
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; min-height:100%;
    background:#000;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:#fff;
  }
  a{ color:inherit; }
  .top{
    display:flex; align-items:center; gap:10px;
    padding:14px 16px;
    background:#000;
    border-bottom:1px solid #1a1a1a;
  }
  .top img{ width:34px; height:34px; border-radius:8px; }
  .top-titles{ display:flex; flex-direction:column; }
  .top-titles h1{
    margin:0; font-size:15px; letter-spacing:0.04em;
    color:#FFC72C; text-transform:uppercase;
  }
  .top-titles .sub{ font-size:11px; color:#666; }
  .back-link{
    margin-left:auto;
    font-size:12px;
    color:#8a6a1c;
    text-decoration:none;
    border:1px solid #2e2e2e;
    padding:6px 10px;
    border-radius:6px;
    white-space:nowrap;
  }
  .board-outer{
    max-width:1100px;
    margin:18px auto 40px;
    padding:0 12px;
  }
  .board{
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 1px, transparent 1px, transparent 3px),
      linear-gradient(180deg, #1f7a5c, #145c44);
    border:6px solid #0b3d2e;
    border-radius:6px;
    padding:14px;
  }
  .league-bar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    background:#175a43;
    border:2px solid #0b3d2e;
    border-radius:4px;
    padding:8px 10px;
    margin:16px 0 10px;
  }
  .league-bar:first-of-type{ margin-top:4px; }
  .league-num{
    width:34px; height:34px; flex-shrink:0;
    border-radius:50%;
    background:#FFC72C;
    border:3px solid #8a6a1c;
    color:#0b3d2e;
    font-weight:800;
    font-size:14px;
    display:flex; align-items:center; justify-content:center;
  }
  .league-title{
    font-size:clamp(16px,3.6vw,26px);
    font-weight:800;
    letter-spacing:0.08em;
    color:#fff;
    text-transform:uppercase;
    text-align:center;
    text-shadow:1px 1px 0 rgba(0,0,0,0.3);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:2px;
    background:#0b3d2e;
    border:2px solid #0b3d2e;
  }
  @media (max-width:820px){ .grid{ grid-template-columns:repeat(2, 1fr); } }
  @media (max-width:440px){ .grid{ grid-template-columns:1fr; } .league-num{ display:none; } }
  .cell{
    background:#175a43;
    padding:8px 10px;
    display:flex;
    align-items:center;
    gap:8px;
    min-height:78px;
  }
  .diamond-wrap{
    position:relative;
    width:52px; height:52px;
    flex-shrink:0;
    display:flex; flex-direction:column; align-items:center;
  }
  .diamond-wrap svg{ width:52px; height:52px; }
  .out-lights{
    display:flex; gap:3px; margin-top:2px;
  }
  .out-light{
    width:6px; height:6px; border-radius:50%;
    background:#3a2a2a;
    border:1px solid #000;
  }
  .out-light.lit{ background:#ff3b30; box-shadow:0 0 4px #ff3b30; }
  .teams{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .team-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:6px;
  }
  .team-abbr{
    font-size:15px;
    font-weight:800;
    letter-spacing:0.03em;
    color:#fff;
    text-transform:uppercase;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .team-abbr.leading{ color:#FFC72C; }
  .team-score{
    font-family:'Courier New', ui-monospace, monospace;
    font-weight:700;
    font-size:20px;
    color:#FFB000;
    text-shadow:0 0 6px rgba(255,176,0,0.55);
    min-width:1.1em;
    text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .status-col{
    flex-shrink:0;
    width:40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
  }
  .status-main{
    font-family:'Courier New', ui-monospace, monospace;
    font-weight:700;
    font-size:14px;
    color:#FFB000;
    text-shadow:0 0 5px rgba(255,176,0,0.5);
    text-align:center;
    line-height:1.1;
  }
  .status-sub{
    font-size:9px;
    color:#9fd4bd;
    letter-spacing:0.05em;
    text-transform:uppercase;
    text-align:center;
  }
  .status-live .status-main{ animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.45; } }
  .footer-bar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-top:16px;
    flex-wrap:wrap;
  }
  .updated{
    font-size:10px;
    letter-spacing:0.1em;
    color:#8a6a1c;
    text-transform:uppercase;
  }
  .refresh-btn{
    font-size:11px;
    color:#FFC72C;
    background:#111;
    border:1px solid #2e2e2e;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .empty-msg{
    text-align:center;
    padding:30px 10px;
    color:#9fd4bd;
    font-size:13px;
  }
</style>
</head>
<body>
<div class="top">
  <img src="apple-touch-icon.png" alt="">
  <div class="top-titles">
    <h1>Out-of-Town Scoreboard</h1>
    <div class="sub">All MLB scores, right field wall style</div>
  </div>
  <a class="back-link" href="index.html">Hoist-O-Meter &rarr;</a>
</div>

<div class="board-outer">
  <div class="board" id="board">
    <div class="empty-msg" id="emptyMsg">Loading today&rsquo;s games&hellip;</div>
  </div>
  <div class="footer-bar">
    <div class="updated" id="updated">LOADING&hellip;</div>
    <button class="refresh-btn" id="refreshBtn">Refresh</button>
  </div>
</div>

<script>
const teamAbbrMap = {
  134:"PIT",113:"CIN",112:"CHC",158:"MIL",138:"STL",
  137:"SF", 119:"LAD",121:"NYM",143:"PHI",144:"ATL",
  146:"MIA",120:"WSH",109:"ARI",115:"COL",135:"SD",
  108:"LAA",117:"HOU",133:"OAK",136:"SEA",140:"TEX",
  116:"DET",118:"KC", 142:"MIN",145:"CWS",114:"CLE",
  110:"BAL",111:"BOS",147:"NYY",139:"TB", 141:"TOR",
};
const NL_TEAM_IDS = new Set([134,113,112,158,138,137,119,121,143,144,146,120,109,115,135]);
const AL_TEAM_IDS = new Set([108,117,133,136,140,116,118,142,145,114,110,111,147,139,141]);

function getAbbr(teamData){
  return teamData.team?.abbreviation
    || teamAbbrMap[teamData.team?.id]
    || (teamData.team?.name ?? "???").substring(0,3).toUpperCase();
}

function diamondSvg(onFirst, onSecond, onThird){
  const dot = (cx, cy, on) => `<circle cx="${cx}" cy="${cy}" r="6" fill="${on ? '#ff3b30' : 'none'}" stroke="${on ? '#ff9a94' : '#FFC72C'}" stroke-width="2"/>`;
  return `
  <svg viewBox="0 0 100 100">
    <polygon points="50,8 92,50 50,92 8,50" fill="none" stroke="#FFC72C" stroke-width="4"/>
    ${dot(50, 28, onSecond)}
    ${dot(72, 50, onFirst)}
    ${dot(28, 50, onThird)}
    <text x="50" y="76" text-anchor="middle" font-size="15" font-weight="800" fill="#FFC72C" font-family="Arial, sans-serif" letter-spacing="1">OUT</text>
  </svg>`;
}

function etDate(){
  return new Date().toLocaleDateString("en-CA", { timeZone:"America/New_York" });
}

async function fetchGames(){
  const url = `https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${etDate()}&hydrate=linescore,team`;
  try{
    const res = await fetch(url);
    const data = await res.json();
    return data.dates?.[0]?.games ?? [];
  }catch(err){
    console.error("Failed to fetch schedule", err);
    return null;
  }
}

function formatStartTime(iso){
  return new Date(iso).toLocaleTimeString("en-US", {
    hour:"numeric", minute:"2-digit", hour12:true, timeZone:"America/New_York",
  });
}

function renderCell(game){
  const away = game.teams.away;
  const home = game.teams.home;
  const awayAbbr = getAbbr(away);
  const homeAbbr = getAbbr(home);
  const state = game.status.abstractGameState;
  const detail = game.status.detailedState;
  const ls = game.linescore || {};
  const isLive = state === "Live";
  const isFinal = state === "Final";
  const isPreview = state === "Preview";

  const awayScore = isPreview ? "" : String(away.score ?? 0);
  const homeScore = isPreview ? "" : String(home.score ?? 0);
  const awayLeading = !isPreview && (away.score ?? 0) > (home.score ?? 0);
  const homeLeading = !isPreview && (home.score ?? 0) > (away.score ?? 0);

  const irregular = /postponed|suspended|delayed|cancelled/i.test(detail || "");

  let statusMain, statusSub, statusClass = "";
  if(irregular){
    statusMain = (detail || "").split(" ")[0].toUpperCase().slice(0,4);
    statusSub = isPreview ? "" : "IN PROGRESS";
  }else if(isFinal){
    statusMain = (ls.currentInning && ls.currentInning !== 9) ? `F/${ls.currentInning}` : "F";
    statusSub = "FINAL";
  }else if(isLive){
    const half = ls.inningState === "Bottom" || ls.inningHalf === "Bottom" ? "▼" : "▲";
    statusMain = `${half}${ls.currentInning ?? ""}`;
    statusSub = `${ls.outs ?? 0} OUT`;
    statusClass = "status-live";
  }else if(isPreview){
    statusMain = formatStartTime(game.gameDate);
    statusSub = "ET";
  }else{
    statusMain = (detail || "").split(" ")[0].toUpperCase().slice(0,5) || "—";
    statusSub = "";
  }

  const outs = ls.outs ?? 0;
  const offense = ls.offense || {};
  const showRunners = isLive;

  return `
  <div class="cell">
    <div class="diamond-wrap">
      ${diamondSvg(showRunners && !!offense.first, showRunners && !!offense.second, showRunners && !!offense.third)}
      <div class="out-lights">
        <div class="out-light ${showRunners && outs >= 1 ? 'lit' : ''}"></div>
        <div class="out-light ${showRunners && outs >= 2 ? 'lit' : ''}"></div>
      </div>
    </div>
    <div class="teams">
      <div class="team-row">
        <span class="team-abbr ${awayLeading ? 'leading' : ''}">${awayAbbr}</span>
        <span class="team-score">${awayScore}</span>
      </div>
      <div class="team-row">
        <span class="team-abbr ${homeLeading ? 'leading' : ''}">${homeAbbr}</span>
        <span class="team-score">${homeScore}</span>
      </div>
    </div>
    <div class="status-col ${statusClass}">
      <div class="status-main">${statusMain}</div>
      <div class="status-sub">${statusSub}</div>
    </div>
  </div>`;
}

function leagueOf(game){
  const awayId = game.teams.away.team?.id;
  const homeId = game.teams.home.team?.id;
  if(NL_TEAM_IDS.has(awayId) && NL_TEAM_IDS.has(homeId)) return "NL";
  if(AL_TEAM_IDS.has(awayId) && AL_TEAM_IDS.has(homeId)) return "AL";
  return "IL";
}

function renderBoard(games){
  const board = document.getElementById("board");
  if(!games || games.length === 0){
    board.innerHTML = `<div class="empty-msg">No games scheduled today.</div>`;
    return;
  }

  const groups = { NL: [], AL: [], IL: [] };
  for(const g of games) groups[leagueOf(g)].push(g);

  const sections = [];
  if(groups.NL.length){
    sections.push(`
      <div class="league-bar">
        <div class="league-num">21</div>
        <div class="league-title">National League</div>
        <div class="league-num">21</div>
      </div>
      <div class="grid">${groups.NL.map(renderCell).join("")}</div>`);
  }
  if(groups.AL.length){
    sections.push(`
      <div class="league-bar">
        <div class="league-num">21</div>
        <div class="league-title">American League</div>
        <div class="league-num">21</div>
      </div>
      <div class="grid">${groups.AL.map(renderCell).join("")}</div>`);
  }
  if(groups.IL.length){
    sections.push(`
      <div class="league-bar">
        <div class="league-title">Interleague</div>
      </div>
      <div class="grid">${groups.IL.map(renderCell).join("")}</div>`);
  }

  board.innerHTML = sections.join("");
}

async function refresh(){
  const games = await fetchGames();
  if(games !== null) renderBoard(games);
  const updatedEl = document.getElementById("updated");
  const now = new Date();
  updatedEl.textContent = games === null
    ? "UPDATE FAILED · RETRYING"
    : `UPDATED ${now.toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit", second:"2-digit" })}`;
}

document.getElementById("refreshBtn").addEventListener("click", refresh);
refresh();
setInterval(refresh, 20000);
</script>
</body>
</html>
